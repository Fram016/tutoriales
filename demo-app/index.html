<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>DemoCRM</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f5f9; color: #1d2433; }
  .hidden { display: none !important; }
  .login { height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #1e3a8a, #2563eb); }
  .card { background: #fff; border-radius: 14px; padding: 40px; width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  h1 { margin: 0 0 24px; font-size: 28px; }
  label { display: block; font-size: 14px; color: #5b6475; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #cfd6e4; border-radius: 8px; font-size: 16px; }
  input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
  .card button { width: 100%; margin-top: 24px; }
  header { background: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e3e8f0; }
  header b { font-size: 22px; color: #1e3a8a; }
  main { padding: 32px; max-width: 1200px; margin: 0 auto; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid #eef1f6; }
  th { background: #f8fafc; color: #5b6475; font-weight: 600; }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; }
  .toast { position: fixed; right: 32px; bottom: 32px; background: #16a34a; color: #fff; padding: 14px 22px; border-radius: 10px; font-size: 16px; }
</style>
</head>
<body>
  <section id="login" class="login">
    <form class="card" id="login-form" onsubmit="event.preventDefault(); login();">
      <h1>DemoCRM</h1>
      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="usuario@empresa.com" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" />
      <button id="btn-login" type="submit">Ingresar</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <header><b>DemoCRM</b><span id="who"></span></header>
    <main>
      <div class="toolbar"><h2>Clientes</h2><button id="btn-new" onclick="openForm()">+ Nuevo cliente</button></div>
      <table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th></tr></thead>
        <tbody id="rows">
          <tr><td>Ana Torres</td><td>ana@correo.com</td><td>099 111 2222</td></tr>
          <tr><td>Luis Pérez</td><td>luis@correo.com</td><td>098 333 4444</td></tr>
        </tbody>
      </table>
    </main>
  </section>

  <div id="modal" class="modal hidden">
    <form class="card" id="client-form" onsubmit="event.preventDefault(); save();">
      <h1>Nuevo cliente</h1>
      <label for="c-name">Nombre</label><input id="c-name" />
      <label for="c-email">Correo</label><input id="c-email" />
      <label for="c-phone">Teléfono</label><input id="c-phone" />
      <button id="btn-save" type="submit">Guardar cliente</button>
    </form>
  </div>
  <div id="toast" class="toast hidden">Cliente guardado</div>

<script>
  const $ = (id) => document.getElementById(id);
  function login() {
    $("who").textContent = $("email").value;
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
  }
  function openForm() { $("modal").classList.remove("hidden"); }
  function save() {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${$("c-name").value}</td><td>${$("c-email").value}</td><td>${$("c-phone").value}</td>`;
    $("rows").prepend(tr);
    $("modal").classList.add("hidden");
    $("toast").classList.remove("hidden");
    setTimeout(() => $("toast").classList.add("hidden"), 2500);
  }
</script>
</body>
</html>
