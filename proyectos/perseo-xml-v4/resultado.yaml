# Perseo XML v4 — take of the final part "Resultado final" (odd/tasks/perseo-resultado.md T2, S1-S4; F1-F3).
# The user's video (File Explorer, dark mode, 1920x1080, 23.9 s) imported as a take; its audio is not used (D5):
#   .venv/Scripts/python.exe tools/import_video_take.py "<video>" --spec proyectos/perseo-xml-v4/resultado.yaml \
#       --out proyectos/perseo-xml-v4/takes/resultado
# then merged after takes/install and proyectos/perseo-xml-v3/capture with tools/merge_takes.py (I3).
# Times are seconds of the source video, boxes its pixels (= viewport). Steps and narration live in tutorial.yaml.
# Blur windows end/start between two frames of the take (5.0 + k/15 s) around each view change, checked frame by frame.
fps: 15
trim: [5.0, 14.6]          # Descargas → Perseo XML → Emitidos → back → Recibidos (clean list, before the selection at 14.67)
viewport: [1920, 1080]
blur:                      # F3
  - {box: [0, 1032, 1920, 48]}                    # Windows taskbar (apps, weather, clock)
  - {box: [0, 198, 232, 31]}                      # left pane: "OneDrive - Personal"
  - {box: [0, 454, 232, 128]}                     # left pane: the user's pinned folders (perseo-web, out)
  - {box: [238, 212, 752, 800], to: 7.88}         # Descargas: every row but "Perseo XML" (blank load 7.80-7.87)
  - {box: [266, 185, 308, 253], from: 9.70, to: 13.10}   # Emitidos: file names (clave de acceso with the RUC)
  - {box: [266, 185, 308, 309], from: 14.03}              # Recibidos: file names
steps:
  - id: descargas
    t0: 5.0
    t1: 7.6
    events:
      - {type: press_visual, t: 5.2, box: {x: 28, y: 297, w: 200, h: 26}, selector: "manual:panel-descargas", target_text: "Descargas"}   # the pointer is already there
  - id: carpeta-perseo
    t0: 7.6
    t1: 9.6
    events:
      - {type: click, t: 7.76, box: {x: 248, y: 187, w: 722, h: 25}, selector: "manual:fila-perseo-xml", target_text: "Perseo XML"}
      - {type: result, t: 8.3, box: {x: 248, y: 186, w: 598, h: 54}, selector: "manual:carpetas", target_text: "Emitidos Recibidos"}
  - id: resultado-emitidos
    t0: 9.6
    t1: 13.0
    events:
      - {type: click, t: 9.65, box: {x: 248, y: 187, w: 598, h: 25}, selector: "manual:fila-emitidos", target_text: "Emitidos"}
      - {type: result, t: 10.0, box: {x: 248, y: 186, w: 752, h: 252}, selector: "manual:lista-emitidos"}
  - id: resultado-recibidos
    t0: 13.0
    t1: 14.6
    events:
      - {type: click, t: 13.03, box: {x: 370, y: 42, w: 94, h: 28}, selector: "manual:ruta-perseo-xml", target_text: "Perseo XML"}
      - {type: click, t: 13.97, box: {x: 248, y: 215, w: 598, h: 25}, selector: "manual:fila-recibidos", target_text: "Recibidos"}
      - {type: result, t: 14.3, box: {x: 248, y: 186, w: 752, h: 308}, selector: "manual:lista-recibidos"}
