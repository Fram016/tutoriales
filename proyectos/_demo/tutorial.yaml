# Demo tutorial used by the smoke test (python tools/smoke.py). Schema v2 (reglas/reglas-video.md).
# Serve the demo app first: python -m http.server 8765 --directory demo-app
title: Cómo crear un cliente en DemoCRM
product: DemoCRM
app_url: http://127.0.0.1:8765/
viewport: [1920, 1080]
language: es-EC
device: desktop

brand:
  dir: brand            # proyectos/_demo/brand/ (logo.png optional)
  primary: "#2563eb"
  accent: "#facc15"
  background: "#0f172a"
  text: "#ffffff"
  font: "Segoe UI"

glossary:               # L3: one term per concept (the UI says "cliente")
  cliente: [contacto, prospecto, registro]

steps:                  # E2: one list for every video; one step = one action with a visible result
  - id: login
    title: "Inicia sesión"
    narration: "Primero ingresa a DemoCRM con tu correo y tu contraseña."
    actions:
      - type: { into: "#email", text: "env:DEMO_USER" }
      - type: { into: "#password", text: "env:DEMO_PASSWORD" }
      - click: "#btn-login"
      - wait: "#btn-new"

  - id: nuevo
    title: "Abre el formulario"
    narration: "En la lista de clientes, haz clic en Nuevo cliente."
    actions:
      - click: "#btn-new"
      - wait: "#c-name"

  - id: datos
    title: "Completa los datos"
    narration: "Completa el nombre, el correo y el teléfono del cliente."
    actions:
      - type: { into: "#c-name", text: "María González" }
      - type: { into: "#c-email", text: "maria@empresa.com" }
      - type: { into: "#c-phone", text: "099 555 1234" }

  - id: guardar
    title: "Guarda el cliente"
    narration: "Haz clic en Guardar cliente. El cliente nuevo queda primero en la lista, resaltado."
    actions:
      - click: "#btn-save"
      - wait: "#toast"
      # The result is the new row (R1, R3). DemoCRM's toast sits alone in an empty corner: zoomed in it
      # would be > 70 % empty (C4), so it is not framed nor named in the narration.
      - highlight: "#rows tr:first-child"

videos:
  - id: tutorial
    type: TUT
    format: "16:9"
    steps: all
    opening:
      narration: "En este video aprendes a crear clientes."
      text: "Aprende a crear un cliente"
    closing:
      narration: "Siguiente video: editar un cliente."
      text: "Siguiente: editar un cliente"
    music:
      prompt: "Soft corporate ambient, gentle synth pads, light percussion, calm and positive"

  - id: redes
    type: RED
    format: "9:16"
    steps: [nuevo, datos, guardar]
    opening:
      narration: "¿Un cliente nuevo? Regístralo así."
      text: "¿Un cliente nuevo? Regístralo así"
    closing:
      narration: "Mira el tutorial completo."
      text: "Mira el tutorial completo"
    narration:
      nuevo: "En tu lista de clientes, haz clic en Nuevo cliente."
      datos: "Completa el nombre, el correo y el teléfono de tu cliente."
      guardar: "Haz clic en Guardar cliente y tu cliente queda primero en la lista."
    music:
      prompt: "Upbeat rhythmic electronic pop, punchy drums, bright synths, energetic"
