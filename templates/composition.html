<!doctype html>
<!-- HyperFrames composition skeleton filled by tools/compose.py: every double-brace placeholder is replaced verbatim.
     Every overlay rect comes from the plan written to layout.json, so qa.py and the pixels agree. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --primary: {{PRIMARY}};
        --accent: {{ACCENT}};
        --ground: {{BACKGROUND}};
        --ink: {{TEXT}};
        --surface: {{SURFACE}};
        --on-surface: {{ON_SURFACE}};
        --font: {{FONT}};
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        font-family: var(--font);
        color: var(--ink);
        background: var(--ground);
      }
      .clip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

      /* Screen: the UI viewport above the caption band (N3); the camera pans/zooms the 1920x1080
         recording (V1: real crop in 9:16, N9: the same layout all the time). The framing lives in CSS
         variables so children can undo the zoom exactly (constant cursor, C5). */
      #viewport {
        position: absolute;
        left: 0;
        top: 0;
        width: {{WIDTH}}px;
        height: {{VIEW_H}}px;
        overflow: hidden;
        background: var(--ground);
        z-index: 1;
      }
      #cam {
        --cx: 0;
        --cy: 0;
        --s: 1;
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        transform: translate(calc(var(--cx) * 1px), calc(var(--cy) * 1px)) scale(var(--s));
      }
      #screen { object-fit: fill; }

      /* R3/N5: new element outlined in the brand accent (constant width on screen), with a pulsing glow. */
      .hl {
        position: absolute;
        opacity: 0;
        border: calc(6px / var(--s)) solid var(--hl);
        border-radius: calc(10px / var(--s));
      }
      .hl-glow {
        position: absolute;
        inset: calc(-10px / var(--s));
        border-radius: calc(14px / var(--s));
        box-shadow: 0 0 calc(22px / var(--s)) calc(6px / var(--s)) var(--hl);
        opacity: 0.25;
      }

      /* N11: spotlight on the active form field: brand outline thinner than R3 (constant 3 px on screen)
         and a soft dim (<= 25 %) of everything else, an SVG three screens wide centered on the source. */
      .spot {
        position: absolute;
        left: -1920px;
        top: -1080px;
        width: 5760px;
        height: 3240px;
        opacity: 0;
        overflow: visible;
      }
      .spot-ring { stroke-width: calc(3px / var(--s)); }

      /* C5: the cursor lives in source pixels but undoes the camera scale: always {{CURSOR_PX}} px tall. */
      #cursor-layer { pointer-events: none; }
      #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #cursor-body {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform-origin: 0 0;
        transform: scale(calc(1 / var(--s)));
      }
      #cursor-arrow {
        position: absolute;
        left: -4px;
        top: -2px;
        width: {{CURSOR_W}}px;
        height: {{CURSOR_PX}}px;
        transform-origin: 4px 2px;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45));
      }
      #halo {
        position: absolute;
        left: -40px;
        top: -40px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent) 70%, transparent) 0%,
                    color-mix(in srgb, var(--accent) 30%, transparent) 55%, transparent 72%);
        opacity: 0;
      }

      /* N3: fixed caption band outside the UI, in the brand surface color (N5: no black boxes). */
      #band { position: absolute; z-index: 3; background: var(--surface); }
      /* O1-O3: chip and captions share one typography; the chip is the brand primary with white text. */
      .ov-layer { z-index: 4; }
      .ov {
        position: absolute;
        border-radius: {{RADIUS}}px;
        font-size: {{FONT_PX}}px;
        font-weight: 800;
        line-height: {{LINE_H}}px;
        white-space: nowrap;
      }
      .cap { color: var(--on-surface); text-align: center; }
      .chip { padding: {{CHIP_PAD_Y}}px 0; text-align: center; background: {{CHIP_BG}}; color: {{CHIP_FG}}; }

      /* E1 cards: opening (objective / hook), requirements, closing (next video / CTA). */
      .scene { z-index: 10; background: var(--ground); }
      .scene .card-text, .scene .card-title {
        position: absolute;
        text-align: center;
        white-space: nowrap;
        font-weight: 800;
      }
      .scene .card-title, .scene .card-text { color: var(--ink); opacity: 1; }
      .scene .logo { position: absolute; left: 50%; height: 150px; max-width: 60%; transform: translateX(-50%); object-fit: contain; }
      .scene .bar {
        position: absolute;
        left: 50%;
        width: 160px;
        height: 12px;
        margin-left: -80px;
        border-radius: 6px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="{{ORIENTATION}}"
      data-composition-id="main"
      data-start="0"
      data-duration="{{TOTAL}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
    >
      <div id="viewport">
        <div id="cam" data-layout-allow-overflow>
          <video id="screen" class="clip" src="assets/screen.mp4" muted playsinline
                 data-start="{{SCREEN_START}}" data-duration="{{SCREEN}}"></video>
{{HIGHLIGHTS}}
{{SPOTLIGHTS}}
          <div id="cursor-layer" class="clip" data-start="{{SCREEN_START}}" data-duration="{{SCREEN}}">
            <div id="cursor">
              <div id="cursor-body">
                <div id="halo"></div>
                <svg id="cursor-arrow" viewBox="0 0 34 46" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 2 L4 36 L12.5 28.5 L18.5 42.5 L24.5 40 L18.5 26 L30 26 Z"
                        fill="#ffffff" stroke="var(--ground)" stroke-width="2.6" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="band" style="{{BAND}}"></div>
{{OVERLAYS}}
{{CARDS}}
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="{{TOTAL}}"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
{{TIMELINE}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
